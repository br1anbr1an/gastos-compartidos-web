services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI) ───────────────────────────────────────────────────
  backend:
    image: ghcr.io/${GHCR_OWNER}/gastos-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
    ports:
      # Puerto externo (host):puerto interno (container)
      # Útil para acceder directamente al API desde el homelab: http://homelab-ip:8000
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  # ── Frontend (Nginx + Vite build) ───────────────────────────────────────
  frontend:
    image: ghcr.io/${GHCR_OWNER}/gastos-frontend:latest
    restart: unless-stopped
    ports:
      # La app web estará disponible en: http://homelab-ip:${APP_PORT}
      - "${APP_PORT:-9090}:80"
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:

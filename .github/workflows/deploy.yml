name: Build & Deploy

on:
  push:
    branches:
      - main   # Build only
      - prod   # Build + Deploy to homelab
  workflow_dispatch:

jobs:
  # ── Build & push images to GitHub Container Registry ──────────────────────
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/prod' && 'production' || '' }}
    permissions:
      contents: read
      packages: write   # necesario para hacer push a ghcr.io
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        if: github.ref == 'refs/heads/prod'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.ref == 'refs/heads/prod' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/gastos-backend:latest
            ghcr.io/${{ github.repository_owner }}/gastos-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.ref == 'refs/heads/prod' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/gastos-frontend:latest
            ghcr.io/${{ github.repository_owner }}/gastos-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

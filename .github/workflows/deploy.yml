name: Build & Deploy

on:
  push:
    branches:
      - main   # Build only
      - prod   # Build + Deploy to homelab
  workflow_dispatch:

jobs:
  # ── Build & push images to Docker Hub ────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gastos-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gastos-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gastos-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gastos-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max



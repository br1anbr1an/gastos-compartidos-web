server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=30s;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip para assets estáticos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # SPA: todas las rutas caen en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy de /api/ al backend (nombre del servicio Docker: "backend")
    # NOTA: al usar variable en proxy_pass, nginx NO hace strip del prefix /api/
    # automáticamente, por eso se usa rewrite para quitarlo antes del proxy.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        set $upstream http://backend:8000;
        proxy_pass         $upstream;
        proxy_http_version 1.1;

        # Headers necesarios para FastAPI
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts razonables
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Configuración específica para el Stream de eventos (SSE)
    location /api/stream {
        rewrite ^/api/(.*)$ /$1 break;
        set $upstream_stream http://backend:8000;
        proxy_pass         $upstream_stream;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_set_header   Host              $host;
        proxy_cache        off;
        proxy_buffering    off;
        chunked_transfer_encoding on;
        proxy_read_timeout 24h;
    }
}
